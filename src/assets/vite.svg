<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="presenceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="60%" stop-color="#005ac1" />
      <stop offset="100%" stop-color="#0b2e6b" />
    </linearGradient>
    <linearGradient id="checkGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#001844" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Fond Squircle Material 3 -->
  <rect width="512" height="512" rx="116" fill="url(#presenceBg)" />

  <!-- Anneau subtil d'accentuation interne -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="4" />

  <!-- Groupe Emblème Central : Cadran Temporel & Coche de Présence -->
  <g filter="url(#badgeShadow)">
    <!-- Cadran de Pointage Circulaire -->
    <circle cx="236" cy="256" r="140" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" />
    
    <!-- Repères cardinaux et Aiguilles de pointage -->
    <circle cx="236" cy="256" r="14" fill="#ffffff" />
    <line x1="236" y1="256" x2="176" y2="196" stroke="#ffffff" stroke-width="22" stroke-linecap="round" />
    <line x1="236" y1="256" x2="276" y2="160" stroke="#ffffff" stroke-width="18" stroke-linecap="round" />

    <!-- Badge Coche de Présence Validée -->
    <circle cx="348" cy="348" r="88" fill="url(#checkGlow)" stroke="#005ac1" stroke-width="16" />
    <path d="M308 348l28 28 54 -54" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>