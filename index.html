<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#fdfcff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PresenceApp" />
    <title>PresenceApp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" />
    <script>
      // Applique le thème forcé avant le premier rendu : sans cela, un utilisateur en thème sombre
      // reçoit un écran clair pendant le chargement du bundle. La clé est celle de src/composables/useTheme.js.
      (function () {
        try {
          var mode = window.localStorage.getItem('presence_theme')
          if (mode === 'light' || mode === 'dark') {
            document.documentElement.setAttribute('data-theme', mode)
          }
        } catch (error) {
          // Stockage inaccessible : le thème suit alors le réglage du système
        }
      })()
    </script>
    <style>
      #app:empty,
      .app-splash-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        min-height: 100dvh;
        gap: 16px;
        background-color: #fdfcff;
        color: #1a1c1e;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      [data-theme="dark"] #app:empty,
      [data-theme="dark"] .app-splash-container {
        background-color: #111318;
        color: #e2e2e9;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) #app:empty,
        :root:not([data-theme="light"]) .app-splash-container {
          background-color: #111318;
          color: #e2e2e9;
        }
      }
      .app-splash-icon {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background-color: rgba(0, 90, 193, 0.1);
        border: 1px solid rgba(0, 90, 193, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #005ac1;
      }
      [data-theme="dark"] .app-splash-icon {
        background-color: rgba(168, 200, 255, 0.12);
        border: 1px solid rgba(168, 200, 255, 0.25);
        color: #a8c8ff;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) .app-splash-icon {
          background-color: rgba(168, 200, 255, 0.12);
          border: 1px solid rgba(168, 200, 255, 0.25);
          color: #a8c8ff;
        }
      }
      .app-splash-title {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin: 0;
      }
      .app-splash-loader {
        width: 24px;
        height: 24px;
        border: 2.5px solid rgba(0, 90, 193, 0.2);
        border-top-color: #005ac1;
        border-radius: 50%;
        animation: splash-spin 0.8s linear infinite;
        margin-top: 4px;
      }
      [data-theme="dark"] .app-splash-loader {
        border: 2.5px solid rgba(168, 200, 255, 0.2);
        border-top-color: #a8c8ff;
      }
      @keyframes splash-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="app-splash-container">
        <div class="app-splash-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:28px;height:28px;">
            <circle cx="12" cy="12" r="10" />
            <polyline points="12 6 12 12 16 14" />
          </svg>
        </div>
        <h1 class="app-splash-title">PresenceApp</h1>
        <div class="app-splash-loader" aria-label="Chargement de l'application"></div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
